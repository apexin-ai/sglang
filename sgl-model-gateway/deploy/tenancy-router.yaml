# Multi-tenant SGLang router for DeepSeek-V4.1: its quota, Service and
# Deployment.
#
#   kubectl -n infer apply -f tenancy-router.yaml
#
# The ServiceAccount and its Roles live in tenancy-rbac.yaml and the tenant
# keys in tenancy-keys.yaml, shared by every model; both are applied once, and
# this file only references them by name.
#
# Re-applying is safe: the quota ConfigMap declares only `quota.yaml`, so the
# `alloc.yaml` the gateway writes beside it is left alone.
#
# Serves only the prod workers labelled tenancy-pool=dsv41; the rest stay behind
# dsv41-prod-router. Move a worker between the two by adding or removing that
# label (and the matching POST/DELETE /workers on dsv41-prod-router).
#
# PREREQUISITE while the feature ships as a wheel rather than inside an image:
# the tenancy-enabled wheel must sit on the node this pod is pinned to, under
# /mnt/nvme/smg-tenancy/. The container installs it over the image's own
# sglang-router at startup; the published image does not carry the feature.
---
# This model's quota. `quota.yaml` is edited by hand; `alloc.yaml` is written
# by the gateway (current allocations) and must not be declared here.
#
# A tenant not listed is unlimited on this model. Listing one sets a concurrency
# cap, which today is accounted and exported as metrics but not enforced.
# initial seeds the allocation, floor is what a pool shrink may not take away,
# and ceiling is how far the tenant may grow itself via POST /tenants/self/quota.
# Edits take effect within seconds; a document that fails to parse leaves the
# rules in force untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smg-tenant-alloc
  namespace: infer
data:
  quota.yaml: |
    version: 1
    tenants: {}
    # tenants:
    #   chengsong: {initial: 16, floor: 4, ceiling: 48}
---
apiVersion: v1
kind: Service
metadata:
  name: dsv41-tenancy-router
  namespace: infer
spec:
  # NodePort with no fixed port: Kubernetes assigns one, so applying this to
  # another namespace or cluster cannot collide with a port already taken.
  type: NodePort
  selector:
    app: dsv41-tenancy-router
  ports:
    - name: http
      port: 30000
      targetPort: 30000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41-tenancy-router
  namespace: infer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsv41-tenancy-router
  template:
    metadata:
      labels:
        app: dsv41-tenancy-router
    spec:
      # Created by tenancy-rbac.yaml; point this at an existing account instead
      # if that account holds the smg-tenancy and smg-pod-discovery Roles.
      serviceAccountName: smg-tenancy
      # Pinned to the node holding the wheel on its local NVMe. Drop this once
      # the wheel ships inside an image.
      nodeName: e01-cn-sxt50h9v602
      volumes:
        - name: smg-tenancy
          hostPath:
            path: /mnt/nvme/smg-tenancy
            type: Directory
      containers:
        - name: router
          image: docker.io/lmsysorg/sglang:nightly-dev-cu13-20261026-8252e3af
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sha256sum /mnt/nvme/smg-tenancy/sglang_router-*.whl
              python3 -m pip install --no-deps --force-reinstall /mnt/nvme/smg-tenancy/sglang_router-*.whl
              exec python3 -m sglang_router.launch_router \
                --service-discovery \
                --service-discovery-namespace infer \
                --service-discovery-port 30000 \
                --selector app=dsv41-prod role=worker tenancy-pool=dsv41 \
                --dp-aware \
                --policy manual \
                --assignment-mode min_group \
                --request-timeout-secs 10800 \
                --balance-rel-threshold 2 \
                --balance-abs-threshold 20 \
                --worker-startup-timeout-secs 3600 \
                --require-routing-key \
                --tenancy-namespace infer \
                --tenancy-keys-configmap smg-tenant-keys \
                --tenancy-alloc-configmap smg-tenant-alloc \
                --tenancy-pool-headroom 0.8 \
                --host 0.0.0.0 \
                --port 30000
          ports:
            - name: http
              containerPort: 30000
              protocol: TCP
            # Declared so the namespace's PodMonitor scrapes the tenant metrics.
            - name: metrics
              containerPort: 29000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: smg-tenancy
              mountPath: /mnt/nvme/smg-tenancy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
