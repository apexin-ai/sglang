# Example tenancy ConfigMaps.
#
# smg-tenant-keys is operator-maintained and read-only to the gateway. A
# ConfigMap is not encrypted and its contents are visible to anyone who can read
# the namespace, so treat these keys as namespace-visible secrets and restrict
# read access through RBAC (see tenancy-rbac.yaml).
#
# smg-tenant-alloc is written by the gateway. Hand edits are honored -- the
# watcher adopts any generation it did not write -- but they are overwritten by
# the next self-service resize.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smg-tenant-keys
  namespace: infer
data:
  tenants.yaml: |
    version: 1
    tenants:
      - id: team-a
        name: "Team A"
        # Several keys per tenant so a key can be rotated without downtime.
        keys:
          - id: team-a-k1
            key: "sk-example-team-a-1"
            role: user
          - id: team-a-k2
            key: "sk-example-team-a-2"
            role: user
            disabled: true
        quota:
          initial: 32
          floor: 8
          ceiling: 64
      - id: ops
        name: "Platform ops"
        keys:
          - id: ops-k1
            key: "sk-example-ops-1"
            role: admin
        quota:
          initial: 8
          floor: 0
          ceiling: 16
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smg-tenant-alloc
  namespace: infer
data:
  alloc.yaml: |
    allocated:
      team-a: 32
      ops: 8
    generation: 0
