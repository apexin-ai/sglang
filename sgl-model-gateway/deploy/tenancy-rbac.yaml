# ServiceAccount and RBAC for the tenancy router. Apply once per namespace,
# ahead of tenancy-router.yaml, which only references the account by name:
#
#   kubectl -n infer apply -f tenancy-rbac.yaml
#
# To run under an account that already exists instead, skip this file and point
# `serviceAccountName` in tenancy-router.yaml at that account, after granting it
# the two Roles below.
#
# The key ConfigMap is readable only: a gateway that could write it could mint
# itself an admin key. Allocations live in a second ConfigMap it reads and
# writes, which holds no credentials.
#
# list/watch cannot be restricted by resourceNames, so those rules stay
# namespace-wide; the watch is narrowed client-side by a metadata.name field
# selector. Creating the alloc ConfigMap is not granted either — apply it from
# tenancy-router.yaml instead, since `create` cannot be restricted to one name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smg-tenancy
  namespace: infer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smg-tenancy
  namespace: infer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["smg-tenant-keys"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["smg-tenant-alloc"]
    # patch, not update: the gateway rewrites only alloc.yaml, leaving the
    # hand-edited quota.yaml in the same ConfigMap untouched.
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smg-tenancy
  namespace: infer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smg-tenancy
subjects:
  - kind: ServiceAccount
    name: smg-tenancy
    namespace: infer
---
# Separate from the Role above so the ConfigMap grants stay minimal. Only needed
# when the router discovers workers by label instead of taking --worker-urls.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smg-pod-discovery
  namespace: infer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smg-pod-discovery
  namespace: infer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smg-pod-discovery
subjects:
  - kind: ServiceAccount
    name: smg-tenancy
    namespace: infer
